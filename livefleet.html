    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-blue: #104c81;
            --accent-red: #e63946;
            --dark-blue: #0b3154;
            --light-gray: #f4f6f9;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-gray);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .header h1 { margin: 0; font-size: 22px; }

        .back-btn {
            background-color: var(--accent-red);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .tracker-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 340px;
            background-color: white;
            border-right: 1px solid #ccc;
            overflow-y: auto;
            padding: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        .sidebar h2 {
            font-size: 18px;
            color: var(--dark-blue);
            margin-top: 0;
            border-bottom: 2px solid var(--primary-blue);
            padding-bottom: 8px;
        }

        .ship-card {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ship-card:hover {
            border-color: var(--primary-blue);
            background-color: #eef4fa;
        }

        .ship-name {
            font-weight: bold;
            color: var(--primary-blue);
            font-size: 14px;
        }

        .ship-homeport {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            font-weight: bold;
        }

        .ship-status {
            font-size: 12px;
            color: #333;
            margin-top: 4px;
        }

        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }

        .popup-title {
            font-weight: bold;
            color: var(--primary-blue);
            font-size: 15px;
            margin-bottom: 4px;
        }

        .popup-info {
            font-size: 12px;
            color: #333;
            line-height: 1.5;
        }
    </style>
</head>

        function getHeadingAngle(headingStr) {
            if (!headingStr) return 0;
            const match = headingStr.match(/(\d+)°/);
            // Leaflet default divIcon arrow '&#10148;' points to the right (90 deg) by default, 
            // so we subtract 90 degrees to align the arrow tip with the actual heading direction.
            return match ? parseInt(match[1], 10) - 90 : 0;
        }

                const localHour = utcDate.getUTCHours() + matchedPort.tzOffset;
                const adjustedHour = (localHour + 24) % 24;

                if (matchedPort.isOvernight) {
                    // Restrict maximum 2 ships globally to stay overnight at a time
                    if (overnightsAllowedSoFar < 2) {
                        overnightsAllowedSoFar++;
                        statusText = `Docked overnight at ${matchedPort.name}`;
                    } else {
                        isAtPort = false;
                        statusText = `En route (Departed ${matchedPort.name} - Max Overnight Cap Reached)`;
                    }
                } else {
                    if (adjustedHour >= 6 && adjustedHour < 17) {
                        statusText = `Docked at ${matchedPort.name}`;
                    } else {
                        isAtPort = false;
                        statusText = `En route (Departed ${matchedPort.name})`;
                    }
                }
            }

            const currentSpeed = isAtPort ? "0.0 knots" : ship.speed;
            const currentHeading = isAtPort ? "N/A" : ship.heading;
            const headingAngle = getHeadingAngle(ship.heading);

            // Arrow points directly towards movement direction using calculated heading angle minus offset
            const dynamicArrowIcon = L.divIcon({
                html: `<div style="font-size: 20px; color: #104c81; font-weight: bold; text-shadow: 1px 1px 2px white; transform: rotate(${headingAngle}deg);">&#10148;</div>`,
                className: 'custom-arrow-icon',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            const marker = L.marker([todaySpot.lat, todaySpot.lng], { icon: dynamicArrowIcon }).addTo(map);
            
            const popupHTML = `
                <div class="popup-title">${ship.name}</div>
                <div class="popup-info">
                    <strong>Homeport Base:</strong> ${ship.homeport}<br>
                    <strong>Status:</strong> ${statusText}<br>
                    <strong>Speed:</strong> ${currentSpeed}<br>
                    <strong>Heading:</strong> ${currentHeading}<br>
                    <strong>Coordinates:</strong> ${todaySpot.lat.toFixed(4)}°N, ${Math.abs(todaySpot.lng).toFixed(4)}°W
                </div>
            `;
            marker.bindPopup(popupHTML);
            markers[ship.name] = { marker, lat: todaySpot.lat, lng: todaySpot.lng, isSailing: !isAtPort };

            const card = document.createElement('div');
            card.className = 'ship-card';
            card.innerHTML = `
                <div class="ship-name">${ship.name}</div>
                <div class="ship-homeport">${ship.homeport}</div>
                <div class="ship-status">&#128205; ${statusText}</div>
            `;

            card.onclick = () => {
                map.flyTo([todaySpot.lat, todaySpot.lng], 14, { duration: 1.5 });
                marker.openPopup();
            };

            shipListContainer.appendChild(card);
        });

        function animateFleet() {
            Object.keys(markers).forEach(name => {
                let shipObj = markers[name];
                if (shipObj.isSailing) {
                    shipObj.lat += (Math.random() - 0.5) * 0.0008;
                    shipObj.lng += (Math.random() - 0.5) * 0.0008;
                    shipObj.marker.setLatLng([shipObj.lat, shipObj.lng]);
                }
            });
        }
        setInterval(animateFleet, 2000);
    </script>
</body>
</html>

<script src="script.js"></script>
