<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suncrest Cruise Line - Cruises from Jacksonville, FL</title>
    <style>
        :root {
            --primary-blue: #104c81;
            --accent-red: #e63946;
            --light-gray: #f4f6f9;
            --dark-blue: #0b3154;
            --text-dark: #222222;
            --text-light: #666666;
            --border-color: #dbe2ef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--light-gray);
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* Navbar */
        .navbar {
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .back-btn {
            background-color: var(--accent-red);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #c5303c;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(16, 76, 129, 0.78), rgba(11, 49, 84, 0.88)), url('jacksonville-hero.jpg') center/cover;
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .hero h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .hero p {
            font-size: 16px;
            opacity: 0.92;
        }

        /* Filter Bar */
        .filter-bar {
            background: white;
            max-width: 1100px;
            margin: -25px auto 25px auto;
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
            padding: 18px 22px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            border: 1px solid var(--border-color);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .filter-group select {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
        }

        /* Results Header */
        .results-header {
            max-width: 1100px;
            margin: 0 auto 15px auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px;
        }

        .results-count {
            font-size: 20px;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .results-note {
            font-size: 12px;
            color: var(--text-light);
        }

        /* Itinerary Cards Container */
        .itinerary-list {
            max-width: 1100px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }

        .cruise-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .card-top {
            display: flex;
            flex-wrap: wrap;
        }

        .card-img-wrap {
            width: 320px;
            min-height: 210px;
            position: relative;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .card-img-wrap {
                width: 100%;
                height: 200px;
            }
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            flex: 1;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 280px;
        }

        .card-title {
            font-size: 21px;
            font-weight: bold;
            color: var(--dark-blue);
            margin-bottom: 6px;
        }

        .ship-line {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-blue);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .region-tag {
            background: #eef4fa;
            color: var(--primary-blue);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .route-line {
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .view-itinerary-link {
            color: var(--primary-blue);
            font-size: 13px;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            text-align: left;
            width: fit-content;
        }

        .view-itinerary-link:hover {
            color: var(--accent-red);
        }

        .card-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eef2f6;
        }

        .price-block {
            display: flex;
            flex-direction: column;
        }

        .price-from {
            font-size: 11px;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .price-amount {
            font-size: 30px;
            font-weight: bold;
            color: var(--dark-blue);
            line-height: 1.1;
        }

        .price-sub {
            font-size: 11px;
            color: var(--text-light);
        }

        .btn-show-dates {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-show-dates:hover,
        .btn-show-dates.active {
            background-color: var(--dark-blue);
        }

        /* Expandable Dates & Pricing Drawer */
        .dates-drawer {
            display: none;
            background-color: #f8fafc;
            border-top: 1px solid var(--border-color);
            padding: 20px 24px;
        }

        .dates-drawer.open {
            display: block;
        }

        .drawer-header {
            font-size: 15px;
            font-weight: bold;
            color: var(--dark-blue);
            margin-bottom: 14px;
            text-align: center;
        }

        .dates-scroll-row {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .date-box {
            min-width: 205px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        .date-box-header {
            background: #eef4fa;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #dbe2ef;
        }

        .date-range-text {
            font-size: 13px;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .date-year-text {
            font-size: 11px;
            color: var(--text-light);
        }

        .btn-start-booking {
            display: block;
            background-color: var(--accent-red);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            padding: 8px;
            margin: 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .btn-start-booking:hover {
            background-color: #c5303c;
        }

        .cabin-list {
            padding: 0 10px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cabin-tile {
            background-color: var(--primary-blue);
            color: white;
            padding: 8px 10px;
            border-radius: 5px;
            text-align: center;
        }

        .cabin-tile.sold-out {
            background-color: #e2e8f0;
            color: #64748b;
        }

        .cabin-type {
            font-size: 11px;
            opacity: 0.9;
        }

        .cabin-price {
            font-size: 16px;
            font-weight: bold;
        }

        /* Day-by-Day Itinerary Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: white;
            max-width: 680px;
            width: 100%;
            max-height: 85vh;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            background: var(--primary-blue);
            color: white;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-content {
            padding: 20px 24px;
            overflow-y: auto;
        }

        .day-row {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
            background: #fafbfc;
        }

        .day-row-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .day-row-time {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-red);
            margin-top: 2px;
        }

        .day-row-desc {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 6px;
        }
    </style>
</head>

        /* =====================================================================
           RENDER & MODAL LOGIC
           ===================================================================== */
        function populateShipFilter() {
            const shipSelect = document.getElementById('filterShip');
            const uniqueShips = [...new Set(itineraries.map(item => item.ship))];
            uniqueShips.forEach(ship => {
                const option = document.createElement('option');
                option.value = ship;
                option.textContent = ship;
                shipSelect.appendChild(option);
            });
        }

        function renderCabinTile(label, price) {
            if (price === null || price === undefined) {
                return `
                    <div class="cabin-tile sold-out">
                        <div class="cabin-type">${label}</div>
                        <div class="cabin-price">Sold Out</div>
                    </div>
                `;
            }
            return `
                <div class="cabin-tile">
                    <div class="cabin-type">${label}</div>
                    <div class="cabin-price">$${price}*</div>
                </div>
            `;
        }

        function renderItineraries() {
            const selectedShip = document.getElementById('filterShip').value;
            const selectedDuration = document.getElementById('filterDuration').value;
            const selectedYear = document.getElementById('filterYear').value;

            const listContainer = document.getElementById('itineraryList');
            const countDisplay = document.getElementById('resultsCount');

            const filtered = itineraries.filter(item => {
                const matchShip = selectedShip === 'all' || item.ship === selectedShip;
                const matchDuration = selectedDuration === 'all' || String(item.duration) === selectedDuration;
                const matchYear = selectedYear === 'all' || item.dates.some(d => d.year === selectedYear);
                return matchShip && matchDuration && matchYear;
            });

            countDisplay.textContent = `${filtered.length} Cruise Result${filtered.length === 1 ? '' : 's'}`;
            listContainer.innerHTML = '';

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div style="background:white; padding:30px; border-radius:8px; text-align:center; color:#666;">No sailings match your selected filters.</div>`;
                return;
            }

            filtered.forEach(item => {
                const visibleDates = selectedYear === 'all'
                    ? item.dates
                    : item.dates.filter(d => d.year === selectedYear);

                const dateCountText = `Show ${visibleDates.length} Date${visibleDates.length === 1 ? '' : 's'}`;

                const dateCardsHTML = visibleDates.map(d => `
                    <div class="date-box">
                        <div class="date-box-header">
                            <div class="date-range-text">${d.dateRange}</div>
                            <div class="date-year-text">${d.year}</div>
                        </div>
                        <a href="${d.bookingLink}" class="btn-start-booking">Start Booking</a>
                        <div class="cabin-list">
                            ${renderCabinTile('Interior', d.prices.interior)}
                            ${renderCabinTile('Ocean View', d.prices.oceanview)}
                            ${renderCabinTile('Balcony', d.prices.balcony)}
                            ${renderCabinTile('Suite', d.prices.suite)}
                        </div>
                    </div>
                `).join('');

                const cardHTML = `
                    <div class="cruise-card">
                        <div class="card-top">
                            <div class="card-img-wrap">
                                <img src="${item.image}" alt="${item.title}">
                            </div>
                            <div class="card-body">
                                <div>
                                    <div class="card-title">${item.title}</div>
                                    <div class="ship-line">
                                        <span>&#128674; ${item.ship}</span>
                                        <span class="region-tag">${item.regionTag}</span>
                                    </div>
                                    <div class="route-line">&#128205; ${item.routeText}</div>
                                    <button class="view-itinerary-link" onclick="openItineraryModal('${item.id}')">View Itinerary</button>
                                </div>

                                <div class="card-bottom-bar">
                                    <div class="price-block">
                                        <span class="price-from">Starting From</span>
                                        <span class="price-amount">$${item.basePrice}*</span>
                                        <span class="price-sub">average per person, 2 person room</span>
                                    </div>
                                    <button class="btn-show-dates" id="btn-${item.id}" onclick="toggleDatesDrawer('${item.id}', '${dateCountText}')">
                                        ${dateCountText} &#9662;
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="dates-drawer" id="drawer-${item.id}">
                            <div class="drawer-header">Available Dates</div>
                            <div class="dates-scroll-row">
                                ${dateCardsHTML}
                            </div>
                        </div>
                    </div>
                `;

                listContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function toggleDatesDrawer(id, defaultLabel) {
            const drawer = document.getElementById(`drawer-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            const isOpen = drawer.classList.toggle('open');
            btn.classList.toggle('active', isOpen);
            btn.innerHTML = isOpen ? `${defaultLabel} &#9652;` : `${defaultLabel} &#9662;`;
        }

        function openItineraryModal(id) {
            const item = itineraries.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modalTitle').textContent = `${item.title} (${item.ship})`;
            document.getElementById('modalBody').innerHTML = item.days.map(d => `
                <div class="day-row">
                    <div class="day-row-title">${d.day}</div>
                    <div class="day-row-time">${d.time}</div>
                    <div class="day-row-desc">${d.desc}</div>
                </div>
            `).join('');

            document.getElementById('itineraryModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('itineraryModal').classList.remove('open');
        }

        function closeModalOnBackdrop(event) {
            if (event.target.id === 'itineraryModal') {
                closeModal();
            }
        }

        populateShipFilter();
        renderItineraries();
    </script>
