<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suncrest Cruise Line - Bermuda Sailings</title>
    <style>
        :root {
            --primary-blue: #104c81;
            --accent-red: #e63946;
            --light-gray: #f4f6f9;
            --dark-blue: #0b3154;
            --text-dark: #222;
            --gold: #f4a261;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: var(--light-gray);
            color: var(--text-dark);
        }

        .navbar {
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .back-btn {
            background-color: var(--accent-red);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .hero {
            background: linear-gradient(rgba(11, 49, 84, 0.45), rgba(16, 76, 129, 0.65)), url('bermuda1.JPG') center/cover no-repeat;
            color: white;
            text-align: center;
            padding: 90px 20px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }

        .hero h1 { 
            margin: 0; 
            font-size: 48px; 
            letter-spacing: 1px;
            font-family: 'Georgia', serif;
        }
        .hero p { 
            margin: 15px 0 0 0; 
            font-size: 21px; 
            font-weight: bold;
            color: #f1f5f9;
        }

        .search-engine {
            background: white;
            max-width: 1100px;
            margin: -40px auto 30px auto;
            border-radius: 8px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.2);
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            position: relative;
            z-index: 10;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 5px;
        }

        .filter-group select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
            font-size: 14px;
            outline: none;
        }

        .results-header {
            max-width: 1100px;
            margin: 0 auto 15px auto;
            padding: 0 20px;
            font-size: 18px;
            color: var(--dark-blue);
            font-weight: bold;
        }

        .itinerary-list {
            max-width: 1100px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        .itinerary-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            margin-bottom: 25px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        .card-image-banner {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .card-main {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            align-items: center;
        }

        .card-details {
            flex: 1;
            padding: 0 20px 0 0;
            min-width: 280px;
        }

        .card-details h2 {
            margin: 0 0 5px 0;
            color: var(--dark-blue);
            font-size: 22px;
        }

        .ship-badge {
            display: inline-block;
            background-color: #eef4fa;
            color: var(--primary-blue);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .route-path {
            font-size: 13px;
            color: #444;
            line-height: 1.4;
        }

        .card-action {
            text-align: right;
            min-width: 160px;
        }

        .price-label { font-size: 12px; color: #666; }
        .price-value { font-size: 32px; font-weight: bold; color: var(--dark-blue); margin-bottom: 10px; }

        .btn-view-dates {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .btn-view-dates:hover {
            background-color: var(--accent-red);
        }

        .timeline-section {
            background-color: #fafbfc;
            border-top: 1px solid #f0f0f0;
            padding: 15px 20px;
        }

        .timeline-title { font-size: 13px; font-weight: bold; color: #555; margin-bottom: 8px; }
        
        .timeline-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .timeline-day {
            background-color: #eef2f6;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .pricing-dropdown {
            display: none;
            background-color: #f8fafc;
            border-top: 1px dashed #cbd5e1;
            padding: 20px;
        }

        .pricing-dropdown.active {
            display: block;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .price-card {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .price-header {
            background-color: #e2e8f0;
            color: var(--dark-blue);
            font-weight: bold;
            text-align: center;
            padding: 10px;
            font-size: 13px;
        }

        .category-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 12px;
        }

        .category-row:last-of-type { border-bottom: none; }

        .book-now-btn {
            display: block;
            background-color: var(--accent-red);
            color: white;
            text-align: center;
            padding: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="index.html" class="brand">SUNCREST</a>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <div class="hero">
        <h1>Bermuda Voyages</h1>
        <p>Pink sand beaches, crystal turquoise waters, and effortless island living await.</p>
    </div>

    <div class="search-engine">
        <div class="filter-group">
            <label for="filter-year">Sailing Year</label>
            <select id="filter-year" onchange="updateFilters()">
                <option value="all">-- All Sailings --</option>
                <option value="2026">Late 2026</option>
                <option value="2027">2027 Sailings</option>
                <option value="2028">2028 Sailings</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-port">Homeport</label>
            <select id="filter-port" onchange="updateFilters()">
                <option value="all">-- All Homeports --</option>
                <option value="Baltimore">Baltimore, MD</option>
                <option value="New York">Manhattan, NY</option>
                <option value="Norfolk">Norfolk, VA</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-duration">Duration</label>
            <select id="filter-duration" onchange="updateFilters()">
                <option value="all">-- All Durations --</option>
                <option value="4">4-Day Sailings</option>
                <option value="5">5-Day Sailings</option>
                <option value="6">6-Day Sailings</option>
                <option value="7">7-Day Sailings</option>
            </select>
        </div>
    </div>

    <div class="results-header" id="results-count">Showing Results...</div>
    <div class="itinerary-list" id="itinerary-list"></div>

    <script>
        const itineraryTemplates = [
            // ================= BALTIMORE, MD =================
            {
                id: "balt-4d-bermuda",
                homeport: "Baltimore",
                duration: 4,
                variant: "Baltimore Bermuda Express",
                basePrice: 430,
                image: "bermuda1.JPG",
                route: "Baltimore > Fun Day at Sea > King's Wharf, Bermuda > Baltimore",
                days: ["Baltimore (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda (8:00 AM - 4:00 PM)", "Baltimore (Disembarkation)"],
                applicableShips: ["SUNCREST MIRACLE", "SUNCREST GATEWAY"]
            },
            {
                id: "balt-5d-bermuda",
                homeport: "Baltimore",
                duration: 5,
                variant: "Chesapeake to Bermuda Escape",
                basePrice: 510,
                image: "bermuda2.JPG",
                route: "Baltimore > Fun Day at Sea > King's Wharf, Bermuda (Overnight) > King's Wharf, Bermuda > Baltimore",
                days: ["Baltimore (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda (Arrive 10:00 AM)", "King's Wharf, Bermuda (Depart 1:00 PM)", "Baltimore (Disembarkation)"],
                applicableShips: ["SUNCREST MIRACLE", "SUNCREST GATEWAY"]
            },
            {
                id: "balt-6d-bermuda",
                homeport: "Baltimore",
                duration: 6,
                variant: "Bermuda Breeze Getaway",
                basePrice: 580,
                image: "bermuda3.JPG",
                route: "Baltimore > Fun Day at Sea > King's Wharf, Bermuda (Overnight) > King's Wharf, Bermuda > Fun Day at Sea > Baltimore",
                days: ["Baltimore (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda (Arrive 1:00 PM)", "King's Wharf, Bermuda (Depart 4:00 PM)", "Fun Day at Sea", "Baltimore (Disembarkation)"],
                applicableShips: ["SUNCREST MIRACLE", "SUNCREST GATEWAY"]
            },
            {
                id: "balt-7d-bermuda-emerald",
                homeport: "Baltimore",
                duration: 7,
                variant: "Bermuda & Emerald Bay Dual Paradise",
                basePrice: 690,
                image: "bermuda4.JPG",
                route: "Baltimore > Fun Day at Sea > King's Wharf, Bermuda > Fun Day at Sea > Emerald Bay Private Paradise > Fun Day at Sea > Baltimore",
                days: ["Baltimore (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda", "Fun Day at Sea", "Emerald Bay Private Paradise", "Fun Day at Sea", "Baltimore (Disembarkation)"],
                applicableShips: ["SUNCREST MIRACLE", "SUNCREST GATEWAY"]
            },

            // ================= MANHATTAN, NY =================
            {
                id: "ny-4d-bermuda",
                homeport: "New York",
                duration: 4,
                variant: "Bermuda Express Weekend",
                basePrice: 420,
                image: "bermuda1.JPG",
                route: "Manhattan > Fun Day at Sea > King's Wharf, Bermuda > Manhattan",
                days: ["Manhattan (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda", "Manhattan (Disembarkation)"],
                applicableShips: ["SUNCREST TRIANGLE", "SUNCREST MAGIC"]
            },
            {
                id: "ny-5d-bermuda",
                homeport: "New York",
                duration: 5,
                variant: "Bermuda Escape & Overnight",
                basePrice: 510,
                image: "bermuda2.JPG",
                route: "Manhattan > Fun Day at Sea > King's Wharf, Bermuda (Overnight) > King's Wharf, Bermuda > Manhattan",
                days: ["Manhattan (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda (Arrive 8:00 AM)", "King's Wharf, Bermuda (Depart 2:00 PM)", "Manhattan (Disembarkation)"],
                applicableShips: ["SUNCREST TRIANGLE", "SUNCREST MAGIC"]
            },
            {
                id: "ny-6d-bermuda",
                homeport: "New York",
                duration: 6,
                variant: "Manhattan Bermuda Haven",
                basePrice: 620,
                image: "bermuda3.JPG",
                route: "Manhattan > Fun Day at Sea > King's Wharf, Bermuda (Overnight) > King's Wharf, Bermuda > Fun Day at Sea > Manhattan",
                days: ["Manhattan (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda (Arrive 9:00 AM)", "King's Wharf, Bermuda (Depart 3:00 PM)", "Fun Day at Sea", "Manhattan (Disembarkation)"],
                applicableShips: ["SUNCREST TRIANGLE", "SUNCREST MAGIC"]
            },
            {
                id: "ny-7d-bermuda-residency",
                homeport: "New York",
                duration: 7,
                variant: "Bermuda 3-Day Island Residency",
                basePrice: 720,
                image: "bermuda4.JPG",
                route: "Manhattan > Fun Day at Sea > King's Wharf, Bermuda (3 Full Days Docked) > Fun Day at Sea > Manhattan",
                days: ["Manhattan (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda (Day 1)", "King's Wharf, Bermuda (Day 2)", "King's Wharf, Bermuda (Day 3)", "Fun Day at Sea", "Manhattan (Disembarkation)"],
                applicableShips: ["SUNCREST TRIANGLE"]
            },

            // ================= NORFOLK, VA =================
            {
                id: "norfolk-4d-bermuda",
                homeport: "Norfolk",
                duration: 4,
                variant: "Bermuda Quick Sampler",
                basePrice: 410,
                image: "bermuda1.JPG",
                route: "Norfolk > Fun Day at Sea > King's Wharf, Bermuda > Norfolk",
                days: ["Norfolk (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda", "Norfolk (Disembarkation)"],
                applicableShips: ["SUNCREST MAGIC", "SUNCREST HIDEAWAY"]
            },
            {
                id: "norfolk-5d-bermuda",
                homeport: "Norfolk",
                duration: 5,
                variant: "Mid-Atlantic Bermuda Sojourn",
                basePrice: 490,
                image: "bermuda2.JPG",
                route: "Norfolk > Fun Day at Sea > King's Wharf, Bermuda (Overnight) > King's Wharf, Bermuda > Norfolk",
                days: ["Norfolk (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda (Arrive 9:00 AM)", "King's Wharf, Bermuda (Depart 3:00 PM)", "Norfolk (Disembarkation)"],
                applicableShips: ["SUNCREST MAGIC", "SUNCREST HIDEAWAY"]
            },
            {
                id: "norfolk-6d-bermuda-emerald",
                homeport: "Norfolk",
                duration: 6,
                variant: "Bermuda & Emerald Bay Explorer",
                basePrice: 610,
                image: "bermuda3.JPG",
                route: "Norfolk > Fun Day at Sea > King's Wharf, Bermuda > Emerald Bay Private Paradise > Fun Day at Sea > Norfolk",
                days: ["Norfolk (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda", "Emerald Bay Private Paradise", "Fun Day at Sea", "Norfolk (Disembarkation)"],
                applicableShips: ["SUNCREST MAGIC", "SUNCREST HIDEAWAY"]
            },
            {
                id: "norfolk-7d-bermuda-voyager",
                homeport: "Norfolk",
                duration: 7,
                variant: "Bermuda & Island Sun Voyager",
                basePrice: 680,
                image: "bermuda4.JPG",
                route: "Norfolk > Fun Day at Sea > King's Wharf, Bermuda (Overnight) > King's Wharf, Bermuda > Emerald Bay Private Paradise > Fun Day at Sea > Norfolk",
                days: ["Norfolk (Embarkation)", "Fun Day at Sea", "King's Wharf, Bermuda (Arrive 10:00 AM)", "King's Wharf, Bermuda (Depart 1:00 PM)", "Emerald Bay Private Paradise", "Fun Day at Sea", "Norfolk (Disembarkation)"],
                applicableShips: ["SUNCREST MAGIC", "SUNCREST HIDEAWAY"]
            }
        ];

        function getShipClassInformation(ship) {
            const shipUpper = ship.toUpperCase();

            if (shipUpper === "SUNCREST TRIANGLE") {
                return { offset: 100 };
            }
            if (shipUpper === "SUNCREST GATEWAY" || shipUpper === "SUNCREST MIRACLE") {
                return { offset: 10 };
            }
            if (shipUpper === "SUNCREST HIDEAWAY") {
                return { offset: -20 };
            }

            return { offset: 0 };
        }

        function generateSailingsDatabase() {
            const sailings = [];
            const years = ["2026", "2027", "2028"];
            
            itineraryTemplates.forEach(function(tpl) {
                years.forEach(function(year) {
                    tpl.applicableShips.forEach(function(ship) {
                        const classInfo = getShipClassInformation(ship);
                        
                        let rangeStr = "";
                        if (year === "2026") {
                            rangeStr = "May 17 - " + (17 + tpl.duration) + ", 2026";
                        } else if (year === "2027") {
                            rangeStr = "Jun 12 - " + (12 + tpl.duration) + ", 2027";
                        } else {
                            rangeStr = "Jul 08 - " + (8 + tpl.duration) + ", 2028";
                        }

                        sailings.push(createSailingInstance(tpl, ship, year, rangeStr, classInfo));
                    });
                });
            });
            return sailings;
        }

        function createSailingInstance(tpl, ship, year, dateRange, classInfo) {
            const finalBasePrice = tpl.basePrice + classInfo.offset;

            return {
                id: tpl.id + "-" + ship.toLowerCase().replace(/[\s™️®️]/g, "-") + "-" + year,
                ship: ship,
                year: year,
                homeport: tpl.homeport,
                duration: tpl.duration,
                variant: tpl.variant,
                basePrice: finalBasePrice,
                image: tpl.image,
                route: tpl.route,
                days: tpl.days,
                dates: [
                    {
                        range: dateRange,
                        prices: {
                            interior: finalBasePrice,
                            oceanview: Math.round(finalBasePrice * 1.18),
                            balcony: Math.round(finalBasePrice * 1.45),
                            suite: Math.round(finalBasePrice * 2.1)
                        }
                    }
                ]
            };
        }

        const database = generateSailingsDatabase();

        function renderItineraries(list) {
            const container = document.getElementById("itinerary-list");
            const counter = document.getElementById("results-count");
            
            if (!container || !counter) return;
            
            container.innerHTML = "";
            counter.innerText = list.length + " Bermuda Cruise" + (list.length === 1 ? "" : "s") + " Found";

            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px; font-weight:bold; color:#555;">No cruises found matching these options.</div>';
                return;
            }

            list.forEach(function(item) {
                let timelineHTML = "";
                item.days.forEach(function(day, index) {
                    timelineHTML += '<div class="timeline-day">Day ' + (index + 1) + ': ' + day + '</div>';
                });

                let datesHTML = "";
                item.dates.forEach(function(date) {
                    datesHTML += `
                        <div class="price-card">
                            <div class="price-header">${date.range}</div>
                            <div class="category-row">
                                <span>Interior</span>
                                <strong>$${date.prices.interior}*</strong>
                            </div>
                            <div class="category-row">
                                <span>Ocean View</span>
                                <strong>$${date.prices.oceanview}*</strong>
                            </div>
                            <div class="category-row">
                                <span>Balcony</span>
                                <strong>$${date.prices.balcony}*</strong>
                            </div>
                            <div class="category-row">
                                <span>Suite</span>
                                <strong>$${date.prices.suite}*</strong>
                            </div>
                            <a href="#" class="book-now-btn">Start Booking</a>
                        </div>
                    `;
                });

                const cardHTML = `
                    <div class="itinerary-card">
                        <img class="card-image-banner" src="${item.image}" alt="${item.variant}">
                        <div class="card-main">
                            <div class="card-details">
                                <span class="ship-badge">🚢 ${item.ship}</span>
                                <h2>${item.duration}-Day Bermuda Cruise (${item.homeport})</h2>
                                <p class="route-path"><strong>Route:</strong> ${item.route}</p>
                            </div>
                            <div class="card-action">
                                <span class="price-label">Starting at</span>
                                <div class="price-value">$${item.basePrice}*</div>
                                <button class="btn-view-dates" onclick="togglePricing('${item.id}')">Show Dates</button>
                            </div>
                        </div>
                        <div class="timeline-section">
                            <div class="timeline-title">ITINERARY PATHWAY</div>
                            <div class="timeline-grid">${timelineHTML}</div>
                        </div>
                        <div class="pricing-dropdown" id="dropdown-${item.id}">
                            <div style="font-weight:bold; color:var(--dark-blue); margin-bottom:10px;">Select Dates & Room Category</div>
                            <div class="pricing-grid">${datesHTML}</div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function togglePricing(id) {
            const dropdown = document.getElementById("dropdown-" + id);
            if (dropdown) {
                dropdown.classList.toggle("active");
            }
        }

        function updateFilters() {
            const yearSelect = document.getElementById("filter-year");
            const portSelect = document.getElementById("filter-port");
            const durSelect = document.getElementById("filter-duration");

            if (!yearSelect || !portSelect || !durSelect) return;

            const selectedYear = yearSelect.value;
            const selectedPort = portSelect.value;
            const selectedDur = durSelect.value;

            const filteredList = database.filter(function(item) {
                const yearMatch = (selectedYear === "all" || item.year === selectedYear);
                const portMatch = (selectedPort === "all" || item.homeport === selectedPort);
                const durationMatch = (selectedDur === "all" || item.duration.toString() === selectedDur);

                return yearMatch && portMatch && durationMatch;
            });

            renderItineraries(filteredList);
        }

        document.addEventListener("DOMContentLoaded", function() {
            updateFilters();
        });
    </script>
</body>
</html>
