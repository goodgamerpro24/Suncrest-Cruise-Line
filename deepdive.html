<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNCREST Cruise Line - Deep Dive Itineraries</title>
    <style>
        :root {
            --primary-blue: #104c81;
            --accent-red: #e63946;
            --light-gray: #f4f6f9;
            --dark-blue: #0b3154;
            --text-dark: #222;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: var(--light-gray);
            color: var(--text-dark);
        }

        .navbar {
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .back-btn {
            background-color: var(--accent-red);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .hero {
            background: linear-gradient(rgba(11, 49, 84, 0.45), rgba(16, 76, 129, 0.65)), url('DeepDive.jpg') center/cover no-repeat;
            color: white;
            text-align: center;
            padding: 90px 20px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }

        .hero h1 { 
            margin: 0; 
            font-size: 48px; 
            letter-spacing: 1px;
            font-family: 'Georgia', serif;
        }
        .hero p { 
            margin: 15px 0 0 0; 
            font-size: 21px; 
            font-weight: bold;
            color: #f1f5f9;
        }

        .search-engine {
            background: white;
            max-width: 1100px;
            margin: -40px auto 30px auto;
            border-radius: 8px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.2);
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            position: relative;
            z-index: 10;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 5px;
        }

        .filter-group select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
            font-size: 14px;
            outline: none;
        }

        .results-header {
            max-width: 1100px;
            margin: 0 auto 15px auto;
            padding: 0 20px;
            font-size: 18px;
            color: var(--dark-blue);
            font-weight: bold;
        }

        .itinerary-list {
            max-width: 1100px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        .itinerary-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            margin-bottom: 25px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        .card-image-banner {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .card-main {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            align-items: center;
        }

        .card-details {
            flex: 1;
            padding: 0 20px 0 0;
            min-width: 280px;
        }

        .card-details h2 {
            margin: 0 0 5px 0;
            color: var(--dark-blue);
            font-size: 22px;
        }

        .ship-badge {
            display: inline-block;
            background-color: #eef4fa;
            color: var(--primary-blue);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .route-path {
            font-size: 13px;
            color: #444;
            line-height: 1.4;
        }

        .card-action {
            text-align: right;
            min-width: 160px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .price-label { font-size: 12px; color: #666; }
        .price-value { font-size: 32px; font-weight: bold; color: var(--dark-blue); }

        .view-dates-btn {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: background-color 0.2s;
        }

        .view-dates-btn:hover {
            background-color: var(--dark-blue);
        }

        .timeline-section {
            background-color: #fafbfc;
            border-top: 1px solid #f0f0f0;
            padding: 15px 20px;
        }

        .timeline-title { font-size: 13px; font-weight: bold; color: #555; margin-bottom: 8px; }
        
        .timeline-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .timeline-day {
            background-color: #eef2f6;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .pricing-section {
            background-color: #f8fafc;
            border-top: 1px dashed #cbd5e1;
            padding: 20px;
            display: none;
        }

        .pricing-section.active {
            display: block;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .price-card {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .price-header {
            background-color: #e2e8f0;
            color: var(--dark-blue);
            font-weight: bold;
            text-align: center;
            padding: 10px;
            font-size: 13px;
        }

        .category-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 12px;
        }

        .category-row:last-of-type { border-bottom: none; }

        .book-now-btn {
            display: block;
            background-color: var(--accent-red);
            color: white;
            text-align: center;
            padding: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="index.html" class="brand">SUNCREST</a>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <div class="hero">
        <h1>Deep Dive Itineraries</h1>
        <p>Immersive Extended Feature Voyages Across Extraordinary Regions</p>
    </div>

    <div class="search-engine">
        <div class="filter-group">
            <label for="filter-season">Sailing Season</label>
            <select id="filter-season" onchange="updateFilters()">
                <option value="all">-- All Seasons --</option>
                <option value="2027">June - July 2027</option>
                <option value="2028">May - August 2028</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-port">Homeport</label>
            <select id="filter-port" onchange="updateFilters()">
                <option value="all">-- All Homeports --</option>
                <option value="Miami">Miami, FL</option>
                <option value="Port Canaveral">Port Canaveral</option>
                <option value="Tampa">Tampa</option>
                <option value="Los Angeles">Los Angeles (Long Beach), CA</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-duration">Duration</label>
            <select id="filter-duration" onchange="updateFilters()">
                <option value="all">-- All Durations --</option>
                <option value="5">5 Days</option>
                <option value="7">7 Days</option>
                <option value="8">8 Days</option>
                <option value="31">31 Days</option>
            </select>
        </div>
    </div>

    <div class="results-header" id="results-count">Showing Results...</div>
    <div class="itinerary-list" id="itinerary-list"></div>

    <script>
        const deepDiveTemplates = [
            {
                id: "dd-utopia-jamaica",
                seasons: ["2027", "2028"],
                homeport: "Miami, FL",
                disembark: "Miami, FL",
                duration: 7,
                type: "Feature Voyage",
                ship: "Suncrest Utopia",
                basePrice: 750,
                image: "DeepDive.jpg",
                route: "Miami, FL > Montego Bay > Falmouth > Ocho Rios > Miami, FL",
                datesText: "June-July 2027 & May-August 2028",
                days: ["Miami, FL (Embark)", "At Sea", "Montego Bay, Jamaica", "Falmouth, Jamaica", "Ocho Rios, Jamaica", "At Sea", "Miami, FL (Disembark)"]
            },
            {
                id: "dd-magic-dr",
                seasons: ["2027", "2028"],
                homeport: "Port Canaveral",
                disembark: "Port Canaveral",
                duration: 5,
                type: "Feature Voyage",
                ship: "Suncrest Magic",
                basePrice: 620,
                image: "DeepDive.jpg",
                route: "Port Canaveral > Dominican Republic: Emerald Bay & Puerto Plata > Port Canaveral",
                datesText: "June-July 2027 & May-August 2028",
                days: ["Port Canaveral (Embark)", "At Sea", "Emerald Bay, Dominican Republic", "Puerto Plata, Dominican Republic", "At Sea", "Port Canaveral (Disembark)"]
            },
            {
                id: "dd-legacy-dr",
                seasons: ["2027", "2028"],
                homeport: "Miami, FL",
                disembark: "Miami, FL",
                duration: 8,
                type: "Feature Voyage",
                ship: "Suncrest Legacy",
                basePrice: 850,
                image: "DeepDive.jpg",
                route: "Miami, FL > Dominican Republic: Puerto Plata, Emerald Bay, Cabo Rojo & La Romana > Miami, FL",
                datesText: "June-July 2027 & May-August 2028",
                days: ["Miami, FL (Embark)", "At Sea", "Puerto Plata, Dominican Republic", "Emerald Bay, Dominican Republic", "Cabo Rojo, Dominican Republic", "La Romana, Dominican Republic", "At Sea", "Miami, FL (Disembark)"]
            },
            {
                id: "dd-excitement-yucatan",
                seasons: ["2027", "2028"],
                homeport: "Tampa",
                disembark: "Tampa",
                duration: 7,
                type: "Feature Voyage",
                ship: "Suncrest Excitement",
                basePrice: 710,
                image: "DeepDive.jpg",
                route: "Tampa > Yucatan and Mayan Coast > Tampa",
                datesText: "June-July 2027 & May-August 2028",
                days: ["Tampa (Embark)", "At Sea", "Yucatan and Mayan Coast", "Yucatan and Mayan Coast", "At Sea", "At Sea", "Tampa (Disembark)"]
            },
            {
                id: "dd-aurora-stmartin",
                seasons: ["2027", "2028"],
                homeport: "Port Canaveral",
                disembark: "Port Canaveral",
                duration: 8,
                type: "Feature Voyage",
                ship: "Suncrest Aurora",
                basePrice: 830,
                image: "DeepDive.jpg",
                route: "Port Canaveral > St. Martin > St. Maarten > Port Canaveral",
                datesText: "June-July 2027 & May-August 2028",
                days: ["Port Canaveral (Embark)", "At Sea", "St. Martin", "St. Maarten", "At Sea", "At Sea", "At Sea", "Port Canaveral (Disembark)"]
            },
            {
                id: "dd-legacy-puertorico",
                seasons: ["2027", "2028"],
                homeport: "Miami, FL",
                disembark: "Miami, FL",
                duration: 7,
                type: "Feature Voyage",
                ship: "Suncrest Legacy",
                basePrice: 780,
                image: "DeepDive.jpg",
                route: "Miami, FL > San Juan > Ponce > Vieques > Miami, FL",
                datesText: "June-July 2027 & May-August 2028",
                days: ["Miami, FL (Embark)", "At Sea", "San Juan", "Ponce", "Vieques", "At Sea", "Miami, FL (Disembark)"]
            },
            {
                id: "dd-legacy-usvi",
                seasons: ["2027", "2028"],
                homeport: "Miami, FL",
                disembark: "Miami, FL",
                duration: 8,
                type: "Feature Voyage",
                ship: "Suncrest Legacy",
                basePrice: 860,
                image: "DeepDive.jpg",
                route: "Miami, FL > St. Thomas > St. Croix > Miami, FL",
                datesText: "June-July 2027 & May-August 2028",
                days: ["Miami, FL (Embark)", "At Sea", "St. Thomas", "St. Croix", "At Sea", "At Sea", "At Sea", "Miami, FL (Disembark)"]
            },
            {
                id: "dd-retreat-southpacific",
                seasons: ["2027", "2028"],
                homeport: "Los Angeles (Long Beach), CA",
                disembark: "California",
                duration: 31,
                type: "Feature Voyage",
                ship: "Suncrest Retreat",
                basePrice: 3450,
                image: "DeepDive.jpg",
                route: "Los Angeles (Long Beach), CA > Honolulu > Crossing Equator > Papeete > Moorea > Bora Bora > Kahului > California",
                datesText: "June-July 2027 & May-August 2028",
                days: [
                    "Los Angeles (Long Beach), CA (Embark)", "At Sea", "At Sea", "At Sea", "Honolulu", "At Sea", "At Sea", 
                    "Crossing Equator", "At Sea", "Papeete", "Moorea", "Bora Bora", "At Sea", "At Sea", 
                    "At Sea", "At Sea", "At Sea", "At Sea", "Kahului", "At Sea", "At Sea", "At Sea", 
                    "At Sea", "At Sea", "At Sea", "At Sea", "At Sea", "At Sea", "At Sea", "At Sea", "California (Disembark)"
                ]
            }
        ];

        function renderItineraries(list) {
            const container = document.getElementById("itinerary-list");
            const counter = document.getElementById("results-count");
            
            if (!container || !counter) return;
            
            container.innerHTML = "";
            counter.innerText = list.length + " Itinerary" + (list.length === 1 ? "" : "s") + " Found";

            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px; font-weight:bold; color:#555;">No deep dive itineraries found matching your criteria.</div>';
                return;
            }

            list.forEach(function(item) {
                let timelineHTML = "";
                item.days.forEach(function(day, index) {
                    timelineHTML += '<div class="timeline-day">Day ' + (index + 1) + ': ' + day + '</div>';
                });

                let datesHTML = `
                    <div class="price-card">
                        <div class="price-header">${item.datesText}</div>
                        <div class="category-row">
                            <span>Interior</span>
                            <strong>$${item.basePrice}*</strong>
                        </div>
                        <div class="category-row">
                            <span>Ocean View</span>
                            <strong>$${Math.round(item.basePrice * 1.25)}*</strong>
                        </div>
                        <div class="category-row">
                            <span>Balcony</span>
                            <strong>$${Math.round(item.basePrice * 1.55)}*</strong>
                        </div>
                        <div class="category-row">
                            <span>Suite</span>
                            <strong>$${Math.round(item.basePrice * 2.20)}*</strong>
                        </div>
                        <a href="#" class="book-now-btn">Book Voyage</a>
                    </div>
                `;

                const cardHTML = `
                    <div class="itinerary-card">
                        <img class="card-image-banner" src="${item.image}" alt="${item.route}">
                        <div class="card-main">
                            <div class="card-details">
                                <span class="ship-badge">🚢 ${item.ship}</span>
                                <h2>${item.duration}-Day Deep Dive: ${item.route.split(' > ')[1]}</h2>
                                <p class="route-path"><strong>Homeport:</strong> ${item.homeport} | <strong>Route:</strong> ${item.route}</p>
                            </div>
                            <div class="card-action">
                                <span class="price-label">Starting at</span>
                                <div class="price-value">$${item.basePrice}*</div>
                                <button class="view-dates-btn" onclick="togglePricing('${item.id}')">View Details & Dates</button>
                            </div>
                        </div>
                        <div class="timeline-section">
                            <div class="timeline-title">ITINERARY PATHWAY</div>
                            <div class="timeline-grid">${timelineHTML}</div>
                        </div>
                        <div class="pricing-section" id="pricing-${item.id}">
                            <div style="font-weight:bold; color:var(--dark-blue); margin-bottom:10px;">Select Room Category & Season</div>
                            <div class="pricing-grid">${datesHTML}</div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function togglePricing(id) {
            const section = document.getElementById("pricing-" + id);
            if (section) {
                section.classList.toggle("active");
            }
        }

        function updateFilters() {
            const seasonSelect = document.getElementById("filter-season");
            const portSelect = document.getElementById("filter-port");
            const durSelect = document.getElementById("filter-duration");

            if (!seasonSelect || !portSelect || !durSelect) return;

            const selectedSeason = seasonSelect.value;
            const selectedPort = portSelect.value;
            const selectedDur = durSelect.value;

            const filteredList = deepDiveTemplates.filter(function(item) {
                const seasonMatch = (selectedSeason === "all" || item.seasons.includes(selectedSeason));
                const portMatch = (selectedPort === "all" || item.homeport.toLowerCase().includes(selectedPort.toLowerCase()));
                const durationMatch = (selectedDur === "all" || item.duration.toString() === selectedDur);

                return seasonMatch && portMatch && durationMatch;
            });

            renderItineraries(filteredList);
        }

        document.addEventListener("DOMContentLoaded", function() {
            updateFilters();
        });
    </script>
</body>
</html>
